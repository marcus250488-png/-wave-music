name: Build Wave Music APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create . --platforms=android --org com.wavemusic --project-name wave_music

      - name: Configure Android audio permissions and media notification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permissions = '''
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
          '''
          s = s.replace('<application', permissions + '\n    <application', 1)
          audio_components = '''
                  <service android:name="com.ryanheise.audioservice.AudioService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.media.browse.MediaBrowserService"/>
                      </intent-filter>
                  </service>
                  <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MEDIA_BUTTON"/>
                      </intent-filter>
                  </receiver>
          '''
          s = s.replace('</application>', audio_components + '\n    </application>')
          p.write_text(s)
          PY

      - name: Use AudioServiceActivity as MainActivity
        shell: bash
        run: |
          f=$(find android/app/src/main -name 'MainActivity.*' | head -n 1)
          echo "MainActivity: $f"
          if [[ "$f" == *.kt ]]; then
            sed -i 's/import io.flutter.embedding.android.FlutterActivity/import com.ryanheise.audioservice.AudioServiceActivity/; s/FlutterActivity()/AudioServiceActivity()/' "$f"
          else
            sed -i 's/import io.flutter.embedding.android.FlutterActivity;/import com.ryanheise.audioservice.AudioServiceActivity;/; s/extends FlutterActivity/extends AudioServiceActivity/' "$f"
          fi
          cat "$f"

      - name: Force compileSdk 36 on plugin modules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          kts = Path('android/build.gradle.kts')
          groovy = Path('android/build.gradle')
          kts_block = """subprojects {
              if (name != "app") {
                  afterEvaluate {
                      val androidExt = extensions.findByName("android")
                      if (androidExt != null) {
                          for (m in androidExt.javaClass.methods) {
                              val okName = m.name == "setCompileSdk" || m.name == "compileSdkVersion" || m.name == "setCompileSdkVersion"
                              if (okName && m.parameterCount == 1 &&
                                  (m.parameterTypes[0] == Int::class.javaPrimitiveType || m.parameterTypes[0] == Int::class.javaObjectType)) {
                                  try {
                                      m.invoke(androidExt, 36)
                                      break
                                  } catch (e: Exception) {
                                  }
                              }
                          }
                      }
                  }
              }
          }

          """
          groovy_block = """subprojects {
              if (project.name != 'app') {
                  project.afterEvaluate { p ->
                      if (p.hasProperty('android')) {
                          p.android { compileSdkVersion 36 }
                      }
                  }
              }
          }

          """
          if kts.exists():
              kts.write_text(kts_block + kts.read_text())
          elif groovy.exists():
              groovy.write_text(groovy_block + groovy.read_text())
          else:
              raise SystemExit('android/build.gradle(.kts) nao encontrado')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Remove generated default test
        run: rm -rf test

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wave-music-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
