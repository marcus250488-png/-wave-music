name: Build Wave Music APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create . --platforms=android --org com.wavemusic --project-name wave_music

      - name: Add INTERNET permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          p.write_text(s)
          PY

      - name: Force compileSdk 36 on plugin modules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          kts = Path('android/build.gradle.kts')
          groovy = Path('android/build.gradle')
          kts_block = """subprojects {
              if (name != "app") {
                  afterEvaluate {
                      val androidExt = extensions.findByName("android")
                      if (androidExt != null) {
                          for (m in androidExt.javaClass.methods) {
                              val okName = m.name == "setCompileSdk" || m.name == "compileSdkVersion" || m.name == "setCompileSdkVersion"
                              if (okName && m.parameterCount == 1 &&
                                  (m.parameterTypes[0] == Int::class.javaPrimitiveType || m.parameterTypes[0] == Int::class.javaObjectType)) {
                                  try {
                                      m.invoke(androidExt, 36)
                                      break
                                  } catch (e: Exception) {
                                  }
                              }
                          }
                      }
                  }
              }
          }

          """
          groovy_block = """subprojects {
              if (project.name != 'app') {
                  project.afterEvaluate { p ->
                      if (p.hasProperty('android')) {
                          p.android { compileSdkVersion 36 }
                      }
                  }
              }
          }

          """
          lint_kts = """subprojects {
              tasks.configureEach {
                  if (name.startsWith("lintVital") || name.startsWith("lintAnalyze")) {
                      enabled = false
                  }
              }
          }

          """
          lint_groovy = """subprojects {
              tasks.configureEach { t ->
                  if (t.name.startsWith('lintVital') || t.name.startsWith('lintAnalyze')) {
                      t.enabled = false
                  }
              }
          }

          """
          if kts.exists():
              kts.write_text(kts_block + lint_kts + kts.read_text())
          elif groovy.exists():
              groovy.write_text(groovy_block + lint_groovy + groovy.read_text())
          else:
              raise SystemExit('android/build.gradle(.kts) nao encontrado')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Remove generated default test
        run: rm -rf test

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wave-music-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
